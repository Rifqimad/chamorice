<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - CHAMORICE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-page">
        <div class="auth-page-card">
            <a href="index.html" class="auth-logo-link">
                <img src="images/chamorice-logo.png" alt="CHAMORICE">
            </a>
            <h1>Masuk ke Akun</h1>
            <p>Selamat datang kembali! Masuk untuk melanjutkan belanja Anda.</p>

            <button type="button" class="btn-google" id="googleLoginBtn">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
                </svg>
                <span>Masuk dengan Google</span>
            </button>

            <div class="auth-divider"><span>atau masuk dengan email</span></div>

            <form id="loginPageForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="pageLoginEmail" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" class="form-control" id="pageLoginPassword" placeholder="Masukkan kata sandi" required>
                </div>
                <button type="submit" class="btn btn-solid btn-block">Masuk</button>
            </form>

            <p class="auth-footnote">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
            <a href="index.html" class="auth-back-link">← Kembali ke Beranda</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('loginPageForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('pageLoginEmail').value.trim();
            if (!email) return;
            localStorage.setItem('chamoriceUser', JSON.stringify({ email: email, provider: 'email' }));
            window.location.href = 'akun.html';
        });

        document.getElementById('googleLoginBtn').addEventListener('click', function () {
            this.disabled = true;
            this.querySelector('span').textContent = 'Menghubungkan ke Google...';
            setTimeout(() => {
                localStorage.setItem('chamoriceUser', JSON.stringify({ email: 'sahabat.chamorice@gmail.com', provider: 'google' }));
                window.location.href = 'akun.html';
            }, 700);
        });
    </script>
</body>
</html>
